<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arcade</title>
    <script src="sprite.js"></script>
    <style>
        canvas {/*centraliza o canvas no html*/
            position : absolute;
            top: 0px;
            bottom: 0px;
            left: 0px;
            right: 0px;
            margin: auto;
        }
    </style>
</head>
<body>
<script>
    // Variaveis
    var canvas, ctx, ALTURA, LARGURA, Frames=0, maxPulos=3, velocidade=6,
    estadoAtual, record;

    var estados = {
        jogar: 0,
        jogando: 1,
        perdeu: 2
    }

    chao = {
        y: 550,
        altura: 50,
        cor: "rgb(252, 244, 3)",

        desenha: function() {
            ctx.fillStyle = this.cor;
            ctx.fillRect(0, this.y, LARGURA, this.altura);
        }
    }

    Bloco = {
        x:50,
        y:0,
        altura:50,
        largura:50,
        cor: "#ff0000",
        rotacao:0,
        img: null,
        gravidade: 1.6,
        velocidade: 0,
        forcaDoPulo: 22,
        qntpulos:0,
        score:0,

        atualiza: function() {
            this.velocidade += this.gravidade;
            this.y += this.velocidade;
             this.rotacao += 0.1;

            if (this.y > chao.y - this.altura && estadoAtual != estados.perdeu) {
                this.y = chao.y - this.altura;
                this.qntpulos = 0;
                this.velocidade = 0;
            }
        },

        pula: function() {
            if(this.qntpulos < maxPulos) {
                this.velocidade = -this.forcaDoPulo;
                this.qntpulos++;
            }
        },

        reseta: function() {
            this.velocidade = 0;
            this.y = 0;
            this.score = 0;
        },

        desenha: function() {
    if (this.img.complete && this.img.naturalWidth > 0) {
        ctx.save();

        ctx.translate(
            this.x + this.largura / 2,
            this.y + this.altura / 2
        );

        ctx.rotate(this.rotacao);

        ctx.drawImage(
            this.img,
            -this.largura / 2,
            -this.altura / 2,
            this.largura,
            this.altura
        );

        ctx.restore();
    }
}
    }

    obstaculos = {
        _obs: [],
        cores: ["#FF0000", "#FF00FF", "#0031A3", "#00FF04"],
        tempoInsere: 40 + Math.floor(21 * Math.random()),

        insere:function() {
            this._obs.push({
                x: LARGURA,
                largura: 50,
                altura: 40 + Math.floor(120 * Math.random()),
                cor: this.cores[Math.floor(4 * Math.random())],
                passou: false
            });

            this.tempoInsere = 30 + Math.floor(21 * Math.random());
        },
        atualiza:function() {
                if(this.tempoInsere == 0) {
                    this.insere();
                } else {
                    this.tempoInsere--;
                }

            for(var i = 0, tam = this._obs.length; i < tam; i++) {
                var obs = this._obs[i];
                obs.x -= velocidade;

                var obsY = chao.y - obs.altura;
                
                // Colisão
                if (Bloco.x < obs.x + obs.largura &&
                    Bloco.x + Bloco.largura > obs.x &&
                    Bloco.y < obsY + obs.altura &&
                    Bloco.y + Bloco.altura > obsY) {
                    estadoAtual = estados.perdeu;
                    if (Bloco.score > record) {
                        localStorage.setItem("record", Bloco.score);
                        record = Bloco.score;
                    }
                }

                // Conta o score quando o obstáculo passa pelo bloco
                else if (obs.x + obs.largura < Bloco.x && !obs.passou) {
                    Bloco.score++;
                    obs.passou = true;
                }

                if(obs.x <= -obs.largura) {
                    this._obs.splice(i, 1);
                    i--;
                    tam--;
                }
            }
        },

        limpa:function() {
            this._obs = [];
        },

        desenha:function() {
            for(var i = 0, tam = this._obs.length; i < tam; i++) {
                var obs = this._obs[i];
                ctx.fillStyle = obs.cor;
                ctx.fillRect(obs.x, chao.y - obs.altura, obs.largura, obs.altura);
            }
        }
        
    }

function clique(event) {
        if (estadoAtual == estados.jogando) {
            Bloco.pula();
        }

        else if (estadoAtual == estados.jogar) {
            estadoAtual = estados.jogando;
        }

        else if (estadoAtual == estados.perdeu && Bloco.y >= 2 * ALTURA) {
            estadoAtual = estados.jogar;
            obstaculos.limpa();
            Bloco.reseta();
        }


      
    }
    function main()     {
        ALTURA=window.innerHeight;
        LARGURA=window.innerWidth;

        if (LARGURA>=500) {
            LARGURA=600;
            ALTURA=600;
        }
        canvas=document.createElement("canvas");
        canvas.width=LARGURA;
        canvas.height=ALTURA;
        canvas.style.border="1px solid #000";

        ctx=canvas.getContext("2d");
        document.body.appendChild(canvas);

        document.addEventListener("mousedown", clique);
        estadoAtual = estados.jogar;
        record = localStorage.getItem("record");

        if (record == null) {
            record = 0;
        }
        else {
            record = parseInt(record);
        }

        img = new Image();
        img.src = "./Sprites/80amarelo.jpg";

        bananaImg = new Image();
        bananaImg.src = "./Sprites/banana.png";
        Bloco.img = bananaImg;

        bananatronImg = new Image();
        bananatronImg.src = "./Sprites/bananatron.png";
        
        gameOverImg = new Image();
        gameOverImg.src = "./Sprites/Game-over.png";


        roda();
    }
    function roda() {
        atualiza();
        desenha();

        window.requestAnimationFrame(roda);
    }
    function atualiza() {
        Frames++;

        Bloco.atualiza();

        if (estadoAtual == estados.jogando) {
            velocidade += 0.003;
            obstaculos.atualiza();
        }
    }
    
    function desenha()  {
        //ctx.fillStyle="#50beff";
        //ctx.fillRect(0,0,LARGURA,ALTURA);
        if (img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, 0, LARGURA, ALTURA);
        }

        ctx.fillStyle = "#fff";
        ctx.font = "50px Arial";
        ctx.fillText(Bloco.score, 30,30+38);

        if (estadoAtual == estados.jogando) {
            obstaculos.desenha();
        }
        
        else if (estadoAtual == estados.perdeu) {
            if (gameOverImg.complete && gameOverImg.naturalWidth > 0) {
                ctx.drawImage(gameOverImg, LARGURA/2 - 100, ALTURA/2 - 150, 200, 200);
            }
            
            ctx.save();
            ctx.translate(LARGURA/2, ALTURA/2);
            ctx.fillStyle = "#000";
            ctx.font = "30px Arial";

            if (Bloco.score > record) {
                ctx.fillText("Novo Recorde!", -80, -60);
            } else {
                ctx.fillText("Recorde: " + record, -70, -60);
            }

            // Exibe a pontuação atual logo abaixo
            ctx.font = "50px Arial";
            if (Bloco.score < 10) {
                ctx.fillText(Bloco.score, -13, 19);
            } else if (Bloco.score >= 10 && Bloco.score < 100) {
                ctx.fillText(Bloco.score, -26, 19);
            } else {
                ctx.fillText(Bloco.score, -39, 19);
            }
            ctx.restore();
        }

        else if (estadoAtual == estados.jogar) {
            if (bananatronImg.complete && bananatronImg.naturalWidth > 0) {
                ctx.drawImage(bananatronImg, LARGURA/2 - 100, ALTURA/2 - 150, 200, 200);
            }
        }

        chao.desenha();
        Bloco.desenha();
    }

    //inicializa o jogo
    main();

</script>
</body>
</html>
