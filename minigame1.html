<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arcade</title>
    <style>
        canvas {
            position: absolute;
            top: 0px; bottom: 0px; left: 0px; right: 0px;
            margin: auto;
        }
    </style>
</head>
<body>
<script>
    // Variáveis globais de controle do jogo
    var canvas, ctx, ALTURA, LARGURA, Frames = 0, maxPulos = 3, velocidade = 6, estadoAtual, record;

    // Objeto para gerenciar os estados do jogo
    var estados = {
        jogar: 0,
        jogando: 1,
        perdeu: 2
    };

    // Estrutura do chão
    var chao = {
        y: 550,
        altura: 50,
        cor: "rgb(252, 244, 3)",
        desenha: function() {
            ctx.fillStyle = this.cor;
            ctx.fillRect(0, this.y, LARGURA, this.altura);
        }
    };

    // Estrutura do personagem (Bloco)
    var Bloco = {
        x: 50, y: 0, altura: 50, largura: 50,
        gravidade: 1.5, velocidade: 0, forcaDoPulo: 22,
        qntpulos: 0, score: 0, rotacao: 0, img: null,

        // Atualiza física, gravidade e rotação do bloco
        atualiza: function() {
            this.velocidade += this.gravidade;
            this.y += this.velocidade;
            this.rotacao += 0.1;

            // Colisão com o chão
            if (this.y > chao.y - this.altura && estadoAtual != estados.perdeu) {
                this.y = chao.y - this.altura;
                this.qntpulos = 0;
                this.velocidade = 0;
            }
        },

        // Função de pulo com limite de pulos
        pula: function() {
            if (this.qntpulos < maxPulos) {
                this.velocidade = -this.forcaDoPulo;
                this.qntpulos++;
                
                // Toca o som do pulo de forma segura
                if (somPulo) {
                    somPulo.currentTime = 0;
                    somPulo.play().catch(function(e) {});
                }
            }
        },

        reseta: function() {
            this.velocidade = 0;
            this.y = 0;
            this.score = 0;
        },

        // Desenha a imagem rotacionada do bloco
        desenha: function() {
            if (this.img && this.img.complete && this.img.naturalWidth > 0) {
                ctx.save();
                ctx.translate(this.x + this.largura / 2, this.y + this.altura / 2);
                ctx.rotate(this.rotacao);
                ctx.drawImage(this.img, -this.largura / 2, -this.altura / 2, this.largura, this.altura);
                ctx.restore();
            }
        }
    };

    // Gerenciador de obstáculos
    var obstaculos = {
        _obs: [],
        cores: ["#FF0000", "#FF00FF", "#0031A3", "#00FF04"],
        tempoInsere: 0,

        insere: function() {
            this._obs.push({
                x: LARGURA,
                largura: 50,
                altura: 40 + Math.floor(120 * Math.random()),
                cor: this.cores[Math.floor(4 * Math.random())],
                passou: false
            });
            this.tempoInsere = 30 + Math.floor(21 * Math.random());
        },

        atualiza: function() {
            if (this.tempoInsere == 0) {
                this.insere();
            } else {
                this.tempoInsere--;
            }

            // Loop para atualizar cada obstáculo na tela
            for (var i = 0; i < this._obs.length; i++) {
                var obs = this._obs[i];
                obs.x -= velocidade;
                var obsY = chao.y - obs.altura;

                // Verificação de colisão
                if (Bloco.x < obs.x + obs.largura &&
                    Bloco.x + Bloco.largura > obs.x &&
                    Bloco.y < obsY + obs.altura &&
                    Bloco.y + Bloco.altura > obsY) {
                    
                    if (estadoAtual != estados.perdeu) {
                        // Toca o som de game over de forma segura
                        if (somPerdeu) {
                            somPerdeu.currentTime = 0;
                            somPerdeu.play().catch(function(e) {});
                        }
                    }

                    estadoAtual = estados.perdeu;
                    if (Bloco.score > record) {
                        localStorage.setItem("record", Bloco.score);
                        record = Bloco.score;
                    }
                } else if (obs.x + obs.largura < Bloco.x && !obs.passou) {
                    Bloco.score++;
                    obs.passou = true;
                }

                // Remove o obstáculo quando ele sai da tela
                if (obs.x <= -obs.largura) {
                    this._obs.splice(i, 1);
                    i--;
                }
            }
        },

        limpa: function() {
            this._obs = [];
        },

        desenha: function() {
            for (var i = 0; i < this._obs.length; i++) {
                var obs = this._obs[i];
                ctx.fillStyle = obs.cor;
                ctx.fillRect(obs.x, chao.y - obs.altura, obs.largura, obs.altura);
            }
        }
    };

    // Variáveis globais de Imagens e Sons
    var img, bananaImg, bananatronImg, gameOverImg;
    var somPulo, somPerdeu;

    function carregaAssets() {
        // Imagens
        img = new Image();
        img.src = "./Sprites/80amarelo.jpg";
        
        bananaImg = new Image();
        bananaImg.src = "./Sprites/banana.png";
        Bloco.img = bananaImg;
        
        bananatronImg = new Image();
        bananatronImg.src = "./Sprites/bananatron.png";
        
        gameOverImg = new Image();
        gameOverImg.src = "./Sprites/Game-over.png";

        // Sons (Crie uma pasta chamada "Sons" e coloque seus arquivos lá, ou ajuste o caminho)
        somPulo = new Audio();
        somPulo.src = "./Sons/pulo.mp3"; 
        
        somPerdeu = new Audio();
        somPerdeu.src = "./Sons/gameover.mp3";
    }

    // Gerencia cliques do mouse para pular ou reiniciar
    function clique(event) {
        if (estadoAtual == estados.jogando) {
            Bloco.pula();
        } else if (estadoAtual == estados.jogar) {
            estadoAtual = estados.jogando;
        } else if (estadoAtual == estados.perdeu && Bloco.y >= 2 * ALTURA) {
            estadoAtual = estados.jogar;
            obstaculos.limpa();
            Bloco.reseta();
            velocidade = 6;
        }
    }

    // Inicialização do canvas e configurações iniciais
    function main() {
        ALTURA = window.innerHeight;
        LARGURA = window.innerWidth;

        if (LARGURA >= 500) {
            LARGURA = 600;
            ALTURA = 600;
        }

        canvas = document.createElement("canvas");
        canvas.width = LARGURA;
        canvas.height = ALTURA;
        canvas.style.border = "1px solid #000";

        ctx = canvas.getContext("2d");
        document.body.appendChild(canvas);

        document.addEventListener("mousedown", clique);
        estadoAtual = estados.jogar;
        
        record = parseInt(localStorage.getItem("record")) || 0;

        carregaAssets();
        roda();
    }

    // Loop principal do jogo
    function roda() {
        atualiza();
        desenha();
        window.requestAnimationFrame(roda);
    }

    function atualiza() {
        Frames++;
        Bloco.atualiza();

        if (estadoAtual == estados.jogando) {
            velocidade += 0.003;
            obstaculos.atualiza();
        }
    }

    // Renderiza elementos visuais na tela
    function desenha() {
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, 0, LARGURA, ALTURA);
        } else {
            ctx.fillStyle = "#50beff";
            ctx.fillRect(0, 0, LARGURA, ALTURA);
        }

        ctx.fillStyle = "#fff";
        ctx.font = "50px Arial";
        ctx.fillText(Bloco.score, 30, 48);

        if (estadoAtual == estados.jogando) {
            obstaculos.desenha();
        } else if (estadoAtual == estados.perdeu) {
            if (gameOverImg && gameOverImg.complete && gameOverImg.naturalWidth > 0) {
                ctx.drawImage(gameOverImg, LARGURA / 2 - 150, ALTURA / 2 - 160, 300, 300);
            }
            
            ctx.save();
            ctx.translate(LARGURA / 2, ALTURA / 2);
            ctx.fillStyle = "#000";
            ctx.font = "30px Arial";

            if (Bloco.score > record) {
                ctx.fillText("Novo Recorde!", -80, -80);
            } else {
                ctx.fillText("Recorde: " + record, -70, -80);
            }

            ctx.font = "50px Arial";
            var offset = Bloco.score < 10 ? 13 : (Bloco.score < 100 ? 26 : 39);
            ctx.fillText(Bloco.score, -offset, -1);
            ctx.restore();
        } else if (estadoAtual == estados.jogar) {
            if (bananatronImg && bananatronImg.complete && bananatronImg.naturalWidth > 0) {
                ctx.drawImage(bananatronImg, LARGURA / 2 - 100, ALTURA / 2 - 150, 200, 200);
            }
        }

        chao.desenha();
        Bloco.desenha();
    }

    // Inicializa o jogo
    main();
</script>
</body>
</html>
