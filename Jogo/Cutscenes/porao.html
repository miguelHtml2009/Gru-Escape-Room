<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O Porão</title>
    <style>
 /* Correção do seletor universal */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101010;
    color: #eee;
    font-family: 'Special Elite', monospace;
}

header {
    text-align: center;
}

header h1 {
    color: #c62828;
    letter-spacing: 4px;
    margin-bottom: 8px;
}

.sala {
    width: 100%;
    max-width: 1000px;
    margin: 20px auto;
}

.palco {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 4px solid #342820;
    border-radius: 8px;
    background: #111;
}

#sala {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Estilos específicos para áreas ou elementos pelo ID */
#painel-interacao {
    position: absolute;
    inset: 5%;
    z-index: 2;
    overflow: auto;
    padding: clamp(14px, 3vw, 28px);
    color: #f3e9d2;
    background: rgba(9, 10, 12, 0.97);
    border: 2px solid #806b48;
    border-radius: 8px;
    box-shadow: 0 0 35px #000;
}

#painel-interacao[hidden] {
    display: none;
}

#fechar {
    float: right;
    font-size: 1.1rem;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
    padding: 8px 12px;
    margin: 4px;
    color: #f5ead5;
    background: #29231e;
    border: 1px solid #806b48;
    border-radius: 4px;
}

footer {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
    background: #1b1b1b;
    border: 1px solid #39312a;
}

#mensagem {
    color: #e7c88b;
}

#botao-menu {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 10;

    width: 48px;
    height: 48px;

    font-size: 24px;
    margin: 0;

    background: #29231e;
    border: 2px solid #806b48;
    border-radius: 6px;

    cursor: pointer;
}


#menu-pausa {
    position: fixed;
    top: 75px;
    right: 15px;
    z-index: 20;

    width: 240px;
    padding: 20px;

    background: #101010;
    border: 2px solid #806b48;
    border-radius: 8px;

    box-shadow: 0 0 20px #000;
    text-align: center;
}

#menu-pausa[hidden] {
    display: none;
}
/* Botões dentro do menu */
#menu-pausa button {
    display: block;
    width: 100%;
    margin: 10px 0;
}
    </style>
</head>


<body>
    <!-- Botão do menu no canto superior direito -->
    <button id="botao-menu" type="button" onclick="abrirMenu()">
        ☰
    </button>

    <!-- Menu de pausa -->
    <section id="menu-pausa" hidden>
        <h2>Menu do jogo</h2>

        <button type="button" onclick="salvarESair()">
            Salvar e sair
        </button>

        <button type="button" onclick="fecharMenu()">
            Voltar ao jogo
        </button>
    </section>

    <header>
        <h1>O Porão</h1>
        <p>Encontre uma saída antes que seja tarde.</p>
    </header>

    <main class="sala">
        <div class="palco">
            <canvas id="sala" width="800" height="600" onclick="clicarCanvas(event)"></canvas>
            
            <section id="painel-interacao" hidden>
                <button id="fechar" type="button" aria-label="Fechar" onclick="fecharPainel()">✕</button>
                <h2 id="titulo-interacao"></h2>
                <div id="conteudo-interacao"></div>
            </section>
        </div>
    </main>

    <footer>
        <section>
            <h2>Inventário</h2>
            <ul id="inventario"><li>Vazio</li></ul>
        </section>
        <button id="abrir-diario" type="button" onclick="abrirDiario()">Diário de pistas</button>
        <p id="mensagem" aria-live="polite">Você acordou em um porão desconhecido...</p>
    </footer>
</body>

<script>
    
const canvas = document.getElementById("sala");
const ctx = canvas.getContext("2d");
// Troque este caminho pelo sprite da porta aberta que deseja usar.
const SPRITE_PORTA_ABERTA = "../../Sprites/porta-aberta.png";
let portaAberta = false;

// Objetos e texturas do porão
const objetos = [
    {
        id: "fundo",
        imagem: "../../Sprites/parede.png",
        x: 0,
        y: 0,
        largura: 800,
        altura: 600
    },

    {
        id: "porta",
        imagem: "../../Sprites/porta-fechada.png",
        x: 30,
        y: 150,
        largura: 606/2.8,
        altura: 947/2.2,
        onclick: function() {
            abrirPorta();
        }
    },

    {
        id: "geladeira",
        imagem: "../../Sprites/geladeira-fechada.png",
        x: 600,
        y: 235,
        largura: 204/1.2,
        altura: 408/1.2,

        onclick: function() {
            abrirGeladeira();
        }

    },

    {
        id: "senha",
        imagem: "../../Sprites/senha-porta.png",
        x: 260,
        y: 220,
        largura: 397/5,
        altura: 411/5,

         onclick: function() {
            digitarSenha();
        }
    },

    {
        id: "fios",
        imagem: "../../Sprites/fios-fechado.png",
        x: 400,
        y: 450,
        largura: 120,
        altura: 120,

        onclick: function() {
            ligarFios();
        }
    },

    {
        id: "chao",
        cor: "#66b2b2",
        x: 0,
        y: 570,
        largura: 800,
        altura: 150
    }
];

// Carrega as imagens antes de desenhar

function carregarImagem(caminho) {
    return new Promise((resolve, reject) => {
        const imagem = new Image();
        imagem.onload = () => resolve(imagem);
        imagem.onerror = () => reject(new Error("Não foi possível carregar a imagem: " + caminho));
        imagem.src = caminho;
    });
}

function abrirMenu() {
    document.getElementById("menu-pausa").hidden = false;
}

function fecharMenu() {
    document.getElementById("menu-pausa").hidden = true;
}

function salvarESair() {
    // Guarda informações básicas da sessão atual
    const dadosJogo = {
        inventario: Array.from(
            document.querySelectorAll("#inventario li")
        ).map(function(item) {
            return item.textContent;
        }),

        mensagem: document.getElementById("mensagem").textContent
    };

    // Salva os dados no navegador
    localStorage.setItem(
        "savePorao",
        JSON.stringify(dadosJogo)
    );

    // Volta para o menu principal
    window.location.href = "../inicialização/menu_principal/menu.html";
}

function abrirPainel(titulo, conteudo) {
    document.getElementById("titulo-interacao").textContent = titulo;
    document.getElementById("conteudo-interacao").innerHTML = conteudo;
    document.getElementById("painel-interacao").hidden = false;
}

function fecharPainel() {
    document.getElementById("painel-interacao").hidden = true;
}

function abrirDiario() {
    abrirPainel(
        "Diário de pistas",
        `
        <p>Você ainda não encontrou nenhuma pista.</p>
        `
    );
}

async function desenharSala() {
    const imagensCarregadas = [];

    for (const objeto of objetos) {
        if (objeto.cor) {
            imagensCarregadas.push(objeto);
            continue;
        }

        try {
            const imagem = await carregarImagem(objeto.imagem);

            imagensCarregadas.push({
                ...objeto,
                imagemCarregada: imagem
            });
        } catch (erro) {
            console.error("Não foi possível carregar:", erro);
        }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const objeto of imagensCarregadas) {
        if (objeto.cor) {
            ctx.fillStyle = objeto.cor;
            ctx.fillRect(objeto.x, objeto.y, objeto.largura, objeto.altura);
            continue;
        }

        ctx.drawImage(
            objeto.imagemCarregada,
            objeto.x,
            objeto.y,
            objeto.largura,
            objeto.altura
        );
    }
}

function clicarCanvas(event) {
    const rect = canvas.getBoundingClientRect();

    // Converte o clique para as coordenadas internas do Canvas
    const x = (event.clientX - rect.left) * (canvas.width / rect.width);
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);

    // Procura o objeto clicado, começando pelos que estão na frente
    for (let i = objetos.length - 1; i >= 0; i--) {
        const objeto = objetos[i];

        // Ignora o fundo e objetos sem interação
        if (objeto.id === "fundo" || !objeto.onclick) {
            continue;
        }

        // Verifica se o clique está dentro da imagem
        if (
            x >= objeto.x &&
            x <= objeto.x + objeto.largura &&
            y >= objeto.y &&
            y <= objeto.y + objeto.altura
        ) {
            objeto.onclick();
            return;
        }
    }

    document.getElementById("mensagem").textContent =
        "Não há nada interessante aqui.";
}

function abrirPorta() {
    abrirPainel(
        "Porta",
        portaAberta
            ? "<p>A porta está aberta. Você pode sair do porão.</p>"
            : '<p>A porta está trancada. Digite a senha de quatro dígitos.</p><button type="button" onclick="digitarSenha()">Digitar senha</button>'
    );
}

function digitarSenha() {
    abrirPainel(
        "Painel de senha",
        `
            <p>Digite a senha de quatro dígitos:</p>

            <input id="senha" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off">

            <button onclick="verificarSenha()">Confirmar</button>
        `
    );
}

function verificarSenha() {
    const campoSenha = document.getElementById("senha");
    if (!campoSenha) return;

    if (campoSenha.value === "0000") {
        portaAberta = true;
        const porta = objetos.find(objeto => objeto.id === "porta");
        porta.imagem = SPRITE_PORTA_ABERTA;
        desenharSala();

        document.getElementById("mensagem").textContent = "Senha correta! A porta foi aberta.";
        document.getElementById("conteudo-interacao").innerHTML =
            "<p>Senha correta! A porta está aberta.</p>";
    } else {
        document.getElementById("mensagem").textContent = "Senha incorreta. Tente novamente.";
    }
}

function abrirGeladeira() {
    abrirPainel(
        "Geladeira",
        "<p>A geladeira está fechada. Talvez exista algo dentro dela.</p>"
    );
}

function ligarFios() {
    abrirPainel(
        "Fiação elétrica",
        "<p>Os fios estão desconectados. Você precisa descobrir como ligá-los.</p>"
    );
}
desenharSala();



</script>
</html>
