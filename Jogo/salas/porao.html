<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O Porão</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/porao.css">
    <link rel="shortcut icon" type="imagex/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" onclick="pause()">☰</button>

    <section id="menu-pausa" hidden>
        <h2>Menu do jogo</h2>
        <button onclick="saveExit()">Salvar e sair</button>
        <button onclick="deletarProgresso()">Deletar progresso</button>
        <button onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>O Porão</h1>
        <div id="timer">
            <p id="min">05:</p>
            <p id="sec">00</p>
        </div>
    </header>

    <main>
        <div id="sala">
            <img src="../../Sprites/porta-fechada.png" id="porta-fechada">
            <img src="../../Sprites/porta-aberta.png" id="porta-aberta" hidden>

            <img src="../../Sprites/senha-porta.png" id="senha-porta" onclick="abrirPorta()">
            <img src="../../Sprites/senha-porta-zoom.png" id="senha-porta2" onclick="fechar()" hidden>
            <img src="../../Sprites/senha-porta-w.png" id="senha-porta-w" hidden>

            <input type="text" id="senhaInput" inputmode="numeric" maxlength="4" placeholder="0000" required hidden>

            <img src="../../Sprites/geladeira-fechada.png" id="geladeira-fechada" onclick="abrirGeladeira()">
            <img src="../../Sprites/geladeira-aberta.png" id="geladeira-aberta" hidden>

            <img src="../../Sprites/geleia-do-gru.png" id="geleia" hidden onclick="pegarGeleia()">

            <img src="../../Sprites/bilhete.png" id="bilhete" onclick="lerbilhete()">
            <img src="../../Sprites/bilhete-de-perto.png" id="bilhete-de-perto" hidden onclick="deslerbilhete()">


        </div>
    </main>

    <footer>

        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
            </ul>
        </section>

        <button id="abrir-diario" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" hidden onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png" alt="Diário aberto">
                <div id="anotacoes"></div>
                <button onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem">
            Você está no porão.
        </p>

        <nav id="minimapa">
            <h2>Minimapa</h2>
            <div class="salas">
                <section class="sala-mapa" id="minimapaSalaAtual">Porão</section>
                <a class="sala-mapa" href="./laboratorio.html" onclick="save()">Laboratório</a>
                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>
                <a class="sala-mapa" href="./linha-de-montagem.html" onclick="save()">Linha de montagem</a>
                <a class="sala-mapa" href="./refugio.html" onclick="save()">Refúgio</a>
            </div>
        </nav>

    </footer>

    <script src="../js/codigoFonte.js"></script>
    <script src="../js/porao.js"></script>

</body>

</html>
