<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O Porão</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/porao.css">
    <link rel="shortcut icon" type="image/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" type="button" onclick="pause()" aria-label="Abrir menu do jogo">☰</button>

    <section id="menu-pausa" role="dialog" aria-modal="true" aria-labelledby="titulo-menu" hidden>
        <h2 id="titulo-menu">Menu do jogo</h2>
        <button type="button" onclick="saveExit()">Salvar e sair</button>
        <button type="button" onclick="deletarProgresso()">Deletar progresso</button>
        <button type="button" onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>O Porão</h1>
        <div id="timer" role="timer" aria-label="Tempo restante">
            <span id="min">05</span>:<span id="sec">00</span>
        </div>
    </header>

    <main>
        <div id="sala" role="region" aria-label="Porão do Gru, à esquerda um papel na parede, mais à direita uma porta trancada e um painel com senha à sua direita, mais à direita ainda, uma geladeira fechada">
            <img src="../../Sprites/porta-fechada.png" id="porta-fechada" alt="Porta Fechada">
            <img src="../../Sprites/porta-aberta.png" id="porta-aberta" alt="Porta Aberta" hidden>

            <img src="../../Sprites/senha-porta.png" id="senha-porta" alt="Painel com senha" onclick="abrirPorta()">
            <img src="../../Sprites/senha-porta-zoom.png" id="senha-porta2" alt="Painel numérico da porta ampliado" onclick="fechar()" hidden>
            <img src="../../Sprites/senha-porta-w.png" id="senha-porta-w" alt="Painel da porta destrancado com luz verde" hidden>

            <input type="text" id="senhaInput" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Digite a senha de 4 dígitos da porta" required hidden>

            <img src="../../Sprites/geladeira-fechada.png" id="geladeira-fechada" alt="Geladeira Fechada" onclick="abrirGeladeira()">
            <img src="../../Sprites/geladeira-aberta.png" id="geladeira-aberta" alt="Geladeira Aberta" hidden>

            <img src="../../Sprites/geleia-do-gru.png" id="geleia" alt="Pote de geleia do Gru dentro da geladeira" hidden onclick="pegarGeleia()">

            <img src="../../Sprites/bilhete.png" id="bilhete" alt="Bilhete de Gru na parede" onclick="lerbilhete()">
            <img src="../../Sprites/bilhete-de-perto.png" id="bilhete-de-perto"     
            alt="Bilhete de Gru ampliado: Para Vector: Você está contente com o que fez, achou engraçado destruir Todo o legado do qual eu construi?
            Você me tornou um vilão que não gostaria mais de enfrentar, estou indo atrás de seus parentes, dar o troco na mesma moeda.
            Te expurgar seria muito fácil, quero me divertir um pouco antes, Vector em 5 minutos vou fazer você se arrepender amargamente de ter nascido.
            Felonious Gru"  
            onclick="deslerbilhete()" hidden>
        </div>
    </main>

    <footer>

        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
            </ul>
        </section>

        <button type="button" id="abrir-diario" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" role="dialog" aria-modal="true" aria-label="Diário de pistas" hidden onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png" alt="Ilustração de um diário antigo aberto com páginas para anotações de pistas">
                <div id="anotacoes"></div>
                <button type="button" onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem" aria-live="polite">
            Você está no porão.
        </p>

        <nav id="minimapa" aria-label="Minimapa de salas">
            <h2>Minimapa</h2>
            <div class="salas">
                <span class="sala-mapa" id="minimapaSalaAtual" aria-current="page">Porão</span>
                <a class="sala-mapa" href="./laboratorio.html" onclick="save()">Laboratório</a>
                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>
                <a class="sala-mapa" href="./linha-de-montagem.html" onclick="save()">Linha de montagem</a>
                <a class="sala-mapa" href="./refugio.html" onclick="save()">Refúgio</a>
            </div>
        </nav>

    </footer>

    <script src="../js/codigoFonte.js" defer></script>
    <script src="../js/porao.js" defer></script>

</body>

</html>
