<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - A Linha de Montagem</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/linha-de-montagem.css">
    <link rel="shortcut icon" type="image/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" type="button" onclick="pause()" aria-label="Abrir menu do jogo">☰</button>

    <section id="menu-pausa" role="dialog" aria-modal="true" aria-labelledby="titulo-menu" hidden>
        <h2 id="titulo-menu">Menu do jogo</h2>
        <button type="button" onclick="saveExit()">Salvar e sair</button>
        <button type="button" onclick="deletarProgresso()">Deletar progresso</button>
        <button type="button" onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>A Linha de Montagem</h1>
        <div id="timer" role="timer" aria-label="Tempo restante">
            <span id="min">05</span>:<span id="sec">00</span>
        </div>
    </header>
    <main>
        
        <div id="sala" role="region" aria-label="Linha de Montagem, com um telefone vermelho à esquerda e uma esteira com um painel trancado à direita">
            <div id="escuro" onclick="voltarEscuro()"></div>
            <div id="escuro-menu">

                <img src="../../Sprites/fios-fechados.png" id="fios-fechados" alt="Painel elétrico fechado com tampa metálica" onclick="abrirPainel()">
                <img src="../../Sprites/fios-abertos-max.png" id="fios-abertosmax" alt="Interior aberto do painel elétrico com terminais de fios">
                <div class="fios-minigame">
                    <!-- Amarelo -->
                    <img src="../../Sprites/Painel-Fios/amarelo-conectado.png" id="amarelo-conectado" alt="Fio amarelo conectado entre os dois terminais">
                    <img src="../../Sprites/Painel-Fios/amarelo-esquerda.png" id="amarelo-esquerda" alt="Ponta esquerda do fio amarelo"
                        onclick="conectarFios('amarelo', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/amarelo-direita.png" id="amarelo-direita" alt="Ponta direita do fio amarelo"
                        onclick="conectarFios('amarelo', 'direita')">
                    <img src="../../Sprites/Painel-Fios/amarela-tampa.png" id="amarelo-tampa" alt="">
                    <img src="../../Sprites/Painel-Fios/amarela-tampa.png" id="amarelo-tampa2" alt="">

                    <!-- Azul -->
                    <img src="../../Sprites/Painel-Fios/azul-conectado.png" id="azul-conectado" alt="Fio azul conectado entre os dois terminais">
                    <img src="../../Sprites/Painel-Fios/azul-esquerda.png" id="azul-esquerda" alt="Ponta esquerda do fio azul"
                        onclick="conectarFios('azul', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/azul-direita.png" id="azul-direita" alt="Ponta direita do fio azul"
                        onclick="conectarFios('azul', 'direita')">
                    <img src="../../Sprites/Painel-Fios/azul-tampa.png" id="azul-tampa" alt="">
                    <img src="../../Sprites/Painel-Fios/azul-tampa.png" id="azul-tampa2" alt="">

                    <!-- Rosa -->
                    <img src="../../Sprites/Painel-Fios/rosa-conectado.png" id="rosa-conectado" alt="Fio rosa conectado entre os dois terminais">
                    <img src="../../Sprites/Painel-Fios/rosa-esquerda.png" id="rosa-esquerda" alt="Ponta esquerda do fio rosa"
                        onclick="conectarFios('rosa', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/rosa-direita.png" id="rosa-direita" alt="Ponta direita do fio rosa"
                        onclick="conectarFios('rosa', 'direita')">
                    <img src="../../Sprites/Painel-Fios/rosa-tampa.png" id="rosa-tampa" alt="">
                    <img src="../../Sprites/Painel-Fios/rosa-tampa.png" id="rosa-tampa2" alt="">

                    <!-- Vermelho -->
                    <img src="../../Sprites/Painel-Fios/vermelho-conectado.png" id="vermelho-conectado" alt="Fio vermelho conectado entre os dois terminais">
                    <img src="../../Sprites/Painel-Fios/vermelho-esquerda.png" id="vermelho-esquerda" alt="Ponta esquerda do fio vermelho"
                        onclick="conectarFios('vermelho', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/vermelho-direita.png" id="vermelho-direita" alt="Ponta direita do fio vermelho"
                        onclick="conectarFios('vermelho', 'direita')">
                    <img src="../../Sprites/Painel-Fios/vermelho-tampa.png" id="vermelho-tampa" alt="">
                    <img src="../../Sprites/Painel-Fios/vermelho-tampa.png" id="vermelho-tampa2" alt="">
                </div>

            </div>
            <img src="../../Sprites/fios-parafusado.png" id="fios-parafusados" alt="Painel de fios parafusado na esteira" onclick="menuDesparafusar()">
            <img src="../../Sprites/parafuso.png" id="p1" class="parafusos" alt="Parafuso superior esquerdo do painel" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p2" class="parafusos" alt="Parafuso superior direito do painel" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p3" class="parafusos" alt="Parafuso inferior esquerdo do painel" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p4" class="parafusos" alt="Parafuso inferior direito do painel" onclick="tirarParafuso(this)">

            <img src="../../Sprites/fios-abertos.png" id="fios-abertosmin" alt="Painel de fios destampado na esteira" onclick="menuDesparafusar()">
            <img src="../../Sprites/fios-conectados.png" id="fios-conectados" alt="Painel de fios na esteira com todos os cabos conectados">

            <img src="../../Sprites/telefone.png" id="telefone" alt="Telefone vermelho antigo sobre a bancada à esquerda" onclick="atender()">

        </div>

        <audio id="som-energia" src="../../Sons/ringing.mp3" onplay="tocarTelefone()"></audio>
        <section id="painel-telefone" role="dialog" aria-modal="true" aria-labelledby="nome-npc">
            <div class="conversa-telefone">

                <h2 id="nome-npc">Desconhecido</h2>

                <p id="fala-npc" aria-live="off"></p>
                <p id="fala-completa" class="sr-only" aria-live="polite"></p>

                <div id="opcoes-telefone"></div>

                <button type="button" id="continuar-fala" onclick="pularFala()">
                    Pular diálogo
                </button>

                <button type="button" id="desligar-telefone" onclick="fecharTelefone()">
                    Desligar
                </button>

            </div>
        </section>
    </main>

    <footer>

        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
            </ul>
        </section>

        <button type="button" id="abrir-diario" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" role="dialog" aria-modal="true" aria-label="Diário de pistas" hidden onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png" alt="Ilustração de um diário antigo aberto com páginas para anotações de pistas">
                <div id="anotacoes"></div>
                <button type="button" onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem" aria-live="polite">
            Você está na linha de montagem.
        </p>

        <nav id="minimapa" aria-label="Minimapa de salas">
            <h2>Minimapa</h2>

            <div class="salas">

                <a class="sala-mapa" href="./porao.html" onclick="save()">Porão</a>

                <a class="sala-mapa" href="./laboratorio.html" onclick="save()">Laboratório</a>

                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>

                <span class="sala-mapa" id="minimapaSalaAtual" aria-current="page">Linha de montagem</span>
                
                <a class="sala-mapa" href="./refugio.html" onclick="save()">Refúgio</a>
            </div>
        </nav>

    </footer>
    <script src="../js/codigoFonte.js" defer></script>
    <script src="../js/linha-de-montagem.js" defer></script>

</body>

</html>
