<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - A Linha de Montagem</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/linha-de-montagem.css">
    <link rel="shortcut icon" type="image/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" onclick="pause()">☰</button>

    <section id="menu-pausa" hidden>
        <h2>Menu do jogo</h2>
        <button onclick="saveExit()">Salvar e sair</button>
        <button onclick="deletarProgresso()">Deletar progresso</button>
        <button onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>A Linha de Montagem</h1>
        <div id="timer">
            <p id="min">05:</p>
            <p id="sec">15</p>
        </div>
    </header>
    <main>
        
        <div id="sala">
            <div id="escuro" onclick="voltarEscuro()"></div>
            <div id="escuro-menu">
                <img src="../../Sprites/fios-fechados.png" id="fios-fechados" onclick="abrirPainel()">
                <img src="../../Sprites/fios-abertos-max.png" id="fios-abertosmax">
                <div class="fios-minigame">
                    <!-- Amarelo -->
                    <img src="../../Sprites/Painel-Fios/amarelo-conectado.png" id="amarelo-conectado">
                    <img src="../../Sprites/Painel-Fios/amarelo-esquerda.png" id="amarelo-esquerda"
                        onclick="conectarFios('amarelo', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/amarelo-direita.png" id="amarelo-direita"
                        onclick="conectarFios('amarelo', 'direita')">
                    <img src="../../Sprites/Painel-Fios/amarela-tampa.png" id="amarelo-tampa">
                    <img src="../../Sprites/Painel-Fios/amarela-tampa.png" id="amarelo-tampa2">

                    <!-- Azul -->
                    <img src="../../Sprites/Painel-Fios/azul-conectado.png" id="azul-conectado">
                    <img src="../../Sprites/Painel-Fios/azul-esquerda.png" id="azul-esquerda"
                        onclick="conectarFios('azul', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/azul-direita.png" id="azul-direita"
                        onclick="conectarFios('azul', 'direita')">
                    <img src="../../Sprites/Painel-Fios/azul-tampa.png" id="azul-tampa">
                    <img src="../../Sprites/Painel-Fios/azul-tampa.png" id="azul-tampa2">

                    <!-- Rosa -->
                    <img src="../../Sprites/Painel-Fios/rosa-conectado.png" id="rosa-conectado">
                    <img src="../../Sprites/Painel-Fios/rosa-esquerda.png" id="rosa-esquerda"
                        onclick="conectarFios('rosa', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/rosa-direita.png" id="rosa-direita"
                        onclick="conectarFios('rosa', 'direita')">
                    <img src="../../Sprites/Painel-Fios/rosa-tampa.png" id="rosa-tampa">
                    <img src="../../Sprites/Painel-Fios/rosa-tampa.png" id="rosa-tampa2">

                    <!-- Vermelho -->
                    <img src="../../Sprites/Painel-Fios/vermelho-conectado.png" id="vermelho-conectado">
                    <img src="../../Sprites/Painel-Fios/vermelho-esquerda.png" id="vermelho-esquerda"
                        onclick="conectarFios('vermelho', 'esquerda')">
                    <img src="../../Sprites/Painel-Fios/vermelho-direita.png" id="vermelho-direita"
                        onclick="conectarFios('vermelho', 'direita')">
                    <img src="../../Sprites/Painel-Fios/vermelho-tampa.png" id="vermelho-tampa">
                    <img src="../../Sprites/Painel-Fios/vermelho-tampa.png" id="vermelho-tampa2">
                </div>

            </div>
            <img src="../../Sprites/fios-parafusado.png" id="fios-parafusados" onclick="menuDesparafusar()">
            <img src="../../Sprites/parafuso.png" id="p1" class="parafusos" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p2" class="parafusos" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p3" class="parafusos" onclick="tirarParafuso(this)">
            <img src="../../Sprites/parafuso.png" id="p4" class="parafusos" onclick="tirarParafuso(this)">

            <img src="../../Sprites/fios-abertos.png" id="fios-abertosmin" onclick="menuDesparafusar()">
            <img src="../../Sprites/fios-conectados.png" id="fios-conectados" onclick="menuDesparafusar()">


            <img src="../../Sprites/telefone.png" id="telefone" onclick="atender()">

        </div>
        <section id="painel-telefone">
            <div class="conversa-telefone">

                <h2 id="nome-npc">Desconhecido</h2>

                <p id="fala-npc"></p>

                <div id="opcoes-telefone"></div>

                <button id="continuar-fala" onclick="pularFala()">
                    Pular diálogo
                </button>

                <button id="desligar-telefone" onclick="fecharTelefone()">
                    Desligar
                </button>

            </div>
        </section>
    </main>

    <footer>

        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
            </ul>
        </section>

        <button id="abrir-diario" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" hidden onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png" alt="Diário aberto">
                <div id="anotacoes"></div>
                <button onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem">
            Você está na linha de montagem.
        </p>

        <nav id="minimapa">
            <h2>Minimapa</h2>

            <div class="salas">

                <a class="sala-mapa" href="./porao.html" onclick="save()">Porão</a>

                <a class="sala-mapa" href="./laboratorio.html" onclick="save()">Laboratório</a>

                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>

                <section class="sala-mapa" id="minimapaSalaAtual">Linha de Montagem</section>

                <a class="sala-mapa" href="./refugio.html" onclick="save()">Refúgio</a>
            </div>
        </nav>

    </footer>
    <script src="../js/codigoFonte.js" defer></script>
    <script src="../js/linha-de-montagem.js" defer></script>

</body>

</html>
