<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O Laboratório</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/laboratorio.css">
    <link rel="shortcut icon" type="image/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" type="button" onclick="pause()" aria-label="Abrir menu do jogo">☰</button>

    <section id="menu-pausa" role="dialog" aria-modal="true" aria-labelledby="titulo-menu" hidden>
        <h2 id="titulo-menu">Menu do jogo</h2>
        <button type="button" onclick="saveExit()">Salvar e sair</button>
        <button type="button" onclick="deletarProgresso()">Deletar progresso</button>
        <button type="button" onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>O Laboratório</h1>
        <div id="timer" role="timer" aria-label="Tempo restante">
            <span id="min">05</span>:<span id="sec">00</span>
        </div>
    </header>

    <main>
        <div id="sala" role="region"
            aria-label="Laboratório do Gru, com um computador ao centro e um quadro dos minions à direita">
            <img src="../../Sprites/computador.png" id="computador" onclick="abrirComputador()">
            <img src="../../Sprites/zoom.png" id="zoom" hidden>
            <button type="button" onclick="sairZoom()" id="fechar" hidden>X</button>
            <input type="password" id="passwordInput" placeholder="senha" required hidden>
            <form onsubmit="areaDeTrabalho(); return false;">
                <input type="password" id="passwordInput2" placeholder="senha" required hidden>
            </form>

            <img src="../../Sprites/area-de-trabalho.png" id="area-trabalho" hidden>
            <span id="nefario" hidden onclick="bloqueioNefario()">Dr. Nefário</span>
            <img src="../../Sprites/app.png" id="app" onclick="quase()" hidden>

            <img src="../../Sprites/zoom2.png" id="zoom2" hidden>

            <img src="../../Sprites/quadro.png" id="quadro" onclick="rasgarPintura()">
            <img src="../../Sprites/buraco.png" id="buraco" hidden>
            <img src="../../Sprites/chave-Philps.png" id="chave" onclick="pegarChave()" hidden>

            <img src="../../Sprites/desativar.png" id="desativar" onclick="desativar()" hidden>
            <img src="../../Sprites/desativado.png" id="desativado" hidden>
            <label class="interruptor" id="painel-seguranca" hidden>
                <input type="checkbox" id="seguranca">
                <span class="trilho"></span>
            </label>
        </div>
    </main>

    <footer>

        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
            </ul>
        </section>

        <button type="button" id="abrir-diario" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" role="dialog" aria-modal="true" aria-label="Diário de pistas" hidden
            onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png"
                    alt="Ilustração de um diário antigo aberto com páginas para anotações de pistas">
                <div id="anotacoes"></div>
                <button type="button" onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem" aria-live="polite">
            Você está no laboratório.
        </p>

        <nav id="minimapa" aria-label="Minimapa de salas">
            <h2>Minimapa</h2>

            <div class="salas">

                <a class="sala-mapa" href="./porao.html" onclick="save()">Porão</a>

                <span class="sala-mapa" id="minimapaSalaAtual" aria-current="page">Laboratório</span>

                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>

                <a class="sala-mapa" href="./linha-de-montagem.html" onclick="save()">Linha de montagem</a>

                <a class="sala-mapa" href="./refugio.html" onclick="save()">Refúgio</a>
            </div>
        </nav>

    </footer>
    <script src="../js/codigoFonte.js" defer></script>
    <script src="../js/laboratorio.js" defer></script>

</body>

</html>
