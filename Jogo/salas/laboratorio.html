<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O laboratório</title>
    <link rel="stylesheet" href="CSS.css">
</head>


<body>
    <button id="botao-menu" type="button" onclick="abrirMenu()">
        ☰
    </button>

    <section id="menu-pausa" hidden>
        <h2>Menu do jogo</h2>

        <button type="button" onclick="salvarESair()">
            Salvar e sair
        </button>

        <button type="button" onclick="fecharMenu()">
            Voltar ao jogo
        </button>
    </section>

    <header>
        <h1>O Laboratório</h1>
    </header>

    <main class="sala">
        <div class="palco">
            <canvas id="sala" width="800" height="600" onclick="clicarCanvas(event)"></canvas>
        </div>
    </main>

    <footer>
        <section>
            <h2>Inventário</h2>
            <ul id="inventario">
                <li>Vazio</li>
            </ul>
        </section>
        <button id="abrir-diario" type="button" onclick="abrirDiario()">Diário de pistas</button>
        <p id="mensagem" aria-live="polite">Você acordou em um porão desconhecido...</p>

        <nav id="minimapa" aria-label="Minimapa de salas">
            <h2>Minimapa</h2>

            <div class="salas">
                
                <a class="sala-mapa" href="./porao.html">
                    Porão
                </a>

                <section class="sala-mapa" aria-current="page">
                    Laboratório
                </section>

                <a class="sala-mapa" href="./fliperama.html">
                    Fliperama
                </a>

                <a class="sala-mapa" href="./linha-de-montagem.html">
                    Linha de montagem
                </a>

                <a class="sala-mapa" href="./refugio.html">
                    Refúgio
                </a>

            </div>
        </nav>
    </footer>
</body>

<script>

    const canvas = document.getElementById("sala");
    const ctx = canvas.getContext("2d");

    const objetos = [

        {
            id: "fundo",
            imagem: "../../Sprites/parede.png",
            x: 0,
            y: 0,
            largura: 800,
            altura: 600
        },

        {
            id: "chao",
            cor: "#66b2b2",
            x: 0,
            y: 570,
            largura: 800,
            altura: 150
        }

    ];

    function carregarImagem(caminho) {

        return new Promise((resolve, reject) => {

            const imagem = new Image();

            imagem.onload = () => resolve(imagem);

            imagem.onerror = () =>
                reject(
                    new Error(
                        "Não foi possível carregar a imagem: " + caminho
                    )
                );

            imagem.src = caminho;
        });
    }

    async function desenharSala() {

        const imagensCarregadas = [];

        for (const objeto of objetos) {

            if (objeto.cor) {

                imagensCarregadas.push(objeto);
                continue;
            }

            try {

                const imagem =
                    await carregarImagem(objeto.imagem);

                imagensCarregadas.push({
                    ...objeto,
                    imagemCarregada: imagem
                });

            } catch (erro) {

                console.error(
                    "Não foi possível carregar:",
                    erro
                );
            }
        }


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        for (const objeto of imagensCarregadas) {

            if (objeto.cor) {

                ctx.fillStyle = objeto.cor;

                ctx.fillRect(
                    objeto.x,
                    objeto.y,
                    objeto.largura,
                    objeto.altura
                );

                continue;
            }

            ctx.drawImage(
                objeto.imagemCarregada,
                objeto.x,
                objeto.y,
                objeto.largura,
                objeto.altura
            );
        }
    }

    function clicarCanvas(event) {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            (event.clientX - rect.left) *
            (canvas.width / rect.width);

        const y =
            (event.clientY - rect.top) *
            (canvas.height / rect.height);


        for (
            let i = objetos.length - 1;
            i >= 0;
            i--
        ) {

            const objeto = objetos[i];


            if (
                objeto.id === "fundo" ||
                objeto.id === "chao" ||
                !objeto.onclick
            ) {
                continue;
            }


            if (
                x >= objeto.x &&
                x <= objeto.x + objeto.largura &&
                y >= objeto.y &&
                y <= objeto.y + objeto.altura
            ) {

                objeto.onclick();

                return;
            }
        }

        document.getElementById("mensagem").textContent =
            "Não há nada interessante aqui.";
    }

    desenharSala();

</script>

</html>
