<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - O Refúgio</title>
    <link rel="stylesheet" href="../css/CSS.css">
    <link rel="stylesheet" href="../css/refugio.css">
    <link rel="shortcut icon" type="image/png" href="../../Sprites/icon.ico">
</head>

<body>

    <button id="botao-menu" type="button" onclick="pause()" aria-label="Abrir menu do jogo">☰</button>

    <section id="menu-pausa" role="dialog" aria-modal="true" aria-labelledby="titulo-menu" hidden>
        <h2 id="titulo-menu">Menu do jogo</h2>
        <button type="button" onclick="saveExit()">Salvar e sair</button>
        <button type="button" onclick="deletarProgresso()">Deletar progresso</button>
        <button type="button" onclick="fecharMenu()">Voltar ao jogo</button>
    </section>

    <header>
        <h1>O Refúgio</h1>
        <div id="timer" role="timer" aria-label="Tempo restante">
            <span id="min">05</span>:<span id="sec">00</span>
        </div>
    </header>

    <main>
        <div id="sala" role="region" aria-label="Refúgio do Gru, Doutor Nefário está nessa sala, ele parece meio louco">
            
        </div>
    </main>

    <footer>
        <section>
            <h2>Inventário</h2>
            <ul id="inventario"></ul>
        </section>

        <button id="abrir-diario" type="button" onclick="diario.abrir()">
            Diário de pistas
        </button>

        <div id="fundo-diario" role="dialog" aria-modal="true" aria-label="Diário de pistas" hidden onclick="diario.fechar()">
            <div id="bloco-diario" onclick="event.stopPropagation()">
                <img src="../../Sprites/diario.png" alt="Ilustração de um diário antigo aberto com páginas para anotações de pistas">
                <div id="anotacoes"></div>
                <button type="button" onclick="diario.fechar()">Fechar</button>
            </div>
        </div>

        <p id="mensagem" aria-live="polite">
            Você está no refúgio.
        </p>

        <nav id="minimapa" aria-label="Minimapa de salas">
            <h2>Minimapa</h2>

            <div class="salas">
                <a class="sala-mapa" href="./porao.html" onclick="save()">Porão</a>
                <a class="sala-mapa" href="./laboratorio.html" onclick="save()">Laboratório</a>
                <a class="sala-mapa" href="./fliperama.html" onclick="save()">Fliperama</a>
                <a class="sala-mapa" href="./linha-de-montagem.html" onclick="save()">Linha de montagem</a>
                <span class="sala-mapa" id="minimapaSalaAtual" aria-current="page">Refúgio</span>
            </div>
        </nav>
    </footer>

    <script src="../js/codigoFonte.js" defer></script>
    <script src="../js/refugio.js" defer></script>

</body>

</html>
