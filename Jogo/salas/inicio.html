<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #inicio {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <video id="inicio" src="../../videos/carregando.mp4" autoplay playsinline></video>

    <script>
        const video = document.getElementById("inicio");

        video.addEventListener("ended", () => {
            window.location.href = "porao.html";
        });
    </script>
</body>
</html>
