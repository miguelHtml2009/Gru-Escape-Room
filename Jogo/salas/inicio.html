<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #inicio {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <video id="inicio" src="../../videos/carregando.mp4" autoplay playsinline aria-label="Introdução: Vector queima a casa de Gru, que o sequestra e o bota em um porão"></video>
    <script>
        if (localStorage.getItem("assistiuVideo")) {
            window.location.href = "porao.html";
        } else {
            const video = document.getElementById("inicio");

            video.onended = function () {
                localStorage.setItem("assistiuVideo", "true");
                window.location.href = "porao.html";
            }
        }
    </script>
</body>

</html>
