  <g clip-path="url(#handle-clip)" stroke="#4d140d" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M8 26 H52 M8 36 H52 M8 46 H52 M8 56 H52 M8 66 H52 M8 76 H52"/>
  </g>
  <path d="M20 12 C16 30 17 56 20 78" fill="none" stroke="#fff" stroke-width="2.2" opacity="0.35" stroke-linecap="round"/>

  <!-- virola -->
