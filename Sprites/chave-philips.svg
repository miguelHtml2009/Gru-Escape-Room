<svg xmlns="http://www.w3.org/2000/svg" width="120" height="400" viewBox="0 0 60 200">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8186"/>
      <stop offset="0.3" stop-color="#e9ebed"/>
      <stop offset="0.6" stop-color="#b3b7bb"/>
      <stop offset="1" stop-color="#6a6e73"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c2a1f"/>
      <stop offset="0.3" stop-color="#e25544"/>
      <stop offset="0.65" stop-color="#c93a2b"/>
