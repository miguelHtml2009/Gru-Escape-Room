  <path d="M30 173 V195" stroke="#33363a" stroke-width="1" opacity="0.7"/>
  <path d="M27.2 176 L28.2 190 M32.8 176 L31.8 190" stroke="#33363a" stroke-width="0.8" opacity="0.6"/>
