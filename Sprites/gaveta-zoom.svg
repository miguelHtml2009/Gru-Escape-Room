<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- Borda externa escura -->
  <rect x="2" y="2" width="196" height="136" rx="12" fill="#4e351c" stroke="#362310" stroke-width="2" />
  
  <!-- Corpo principal da gaveta -->
  <rect x="8" y="8" width="184" height="124" rx="8" fill="#7c542d" />
  
  <!-- Moldura interna rebaixada -->
  <rect x="16" y="16" width="168" height="108" rx="5" fill="#8c6036" stroke="#593c1f" stroke-width="3" />
  
  <!-- Linhas decorativas superior e inferior -->
  <line x1="28" y1="34" x2="172" y2="34" stroke="#593c1f" stroke-width="1.5" />
  <line x1="28" y1="106" x2="172" y2="106" stroke="#593c1f" stroke-width="1.5" />

  <!-- Furos vazios nos 4 cantos -->
  <circle cx="27" cy="27" r="4.5" fill="#2b1b0c" stroke="#4e351c" stroke-width="1" />
  <circle cx="173" cy="27" r="4.5" fill="#2b1b0c" stroke="#4e351c" stroke-width="1" />
  <circle cx="27" cy="113" r="4.5" fill="#2b1b0c" stroke="#4e351c" stroke-width="1" />
  <circle cx="173" cy="113" r="4.5" fill="#2b1b0c" stroke="#4e351c" stroke-width="1" />

  <!-- Puxador / Plaqueta dourada central -->
  <rect x="65" y="60" width="70" height="20" rx="10" fill="#4e351c" />
  <rect x="67" y="62" width="66" height="16" rx="8" fill="#d9b336" />
  
  <!-- Brilho superior da plaqueta -->
  <rect x="70" y="63.5" width="60" height="4" rx="2" fill="#f2d66b" />

  <!-- 2 Furos vazios na plaqueta dourada (centros em x=75, y=70 e x=125, y=70) -->
  <circle cx="75" cy="70" r="3.5" fill="#2b1b0c" stroke="#6e5714" stroke-width="1" />
  <circle cx="125" cy="70" r="3.5" fill="#2b1b0c" stroke="#6e5714" stroke-width="1" />
</svg>