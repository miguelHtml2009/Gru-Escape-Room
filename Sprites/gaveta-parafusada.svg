<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140">
  <defs>
    <radialGradient id="metal" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.45" stop-color="#b9bcc0"/>
      <stop offset="1" stop-color="#6b6e73"/>
    </radialGradient>
    <!-- parafuso de fenda -->
    <g id="screw">
      <circle cx="0.8" cy="1.2" r="5.2" fill="#2a1a0c" opacity="0.45"/>
      <circle r="5" fill="url(#metal)" stroke="#3b3d40" stroke-width="1"/>
      <path d="M-3.2 -0.4 L3.2 -0.4" stroke="#2b2c2e" stroke-width="1.8" stroke-linecap="round" transform="rotate(-35)"/>
      <path d="M-3.2 -1.4 L3.2 -1.4" stroke="#ffffff" stroke-width="0.6" opacity="0.5" stroke-linecap="round" transform="rotate(-35)"/>
    </g>
    <!-- parafuso menor para a alça -->
    <g id="screw-s">
      <circle cx="0.6" cy="0.9" r="3.9" fill="#2a1a0c" opacity="0.4"/>
      <circle r="3.8" fill="url(#metal)" stroke="#3b3d40" stroke-width="0.8"/>
      <path d="M-2.4 -0.3 L2.4 -0.3" stroke="#2b2c2e" stroke-width="1.4" stroke-linecap="round" transform="rotate(50)"/>
    </g>
  </defs>

  <rect x="2" y="2" width="196" height="136" rx="8" fill="#7b5230" stroke="#4a2f17" stroke-width="4"/>
  <rect x="14" y="14" width="172" height="112" rx="5" fill="#8a5e37" stroke="#4a2f17" stroke-width="3"/>
  <path d="M26 34 H174 M26 106 H174" stroke="#6d4727" stroke-width="2" opacity="0.7"/>

  <!-- alça (sombra + peça) -->
  <rect x="67" y="62" width="68" height="16" rx="8" fill="#2a1a0c" opacity="0.35"/>
  <rect x="66" y="60" width="68" height="16" rx="8" fill="#d4af37" stroke="#4d3a08" stroke-width="2"/>
  <path d="M74 64 H126" stroke="#f3dc84" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- parafusos da alça -->
  <use href="#screw-s" x="75" y="68"/>
  <use href="#screw-s" x="125" y="68"/>

  <!-- parafusos dos cantos -->
  <use href="#screw" x="26" y="26"/>
  <use href="#screw" x="174" y="26"/>
  <use href="#screw" x="26" y="114"/>
  <use href="#screw" x="174" y="114"/>
</svg>
