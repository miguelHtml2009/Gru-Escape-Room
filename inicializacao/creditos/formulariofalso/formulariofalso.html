<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulariofalso.css">
    <link rel="shortcut icon" type="imagex/png" href="../../../Sprites/icon.ico">

    <title>Formulário</title>
</head>
<body>
    <div class="elementos">
        <header>
            <h1>Nos envie uma mensagem</h1>
        </header>

        <main>
            <form> 
                <fieldset class="forms">
                    <label for="nomeid" >Nome:</label>
                    <input type="text" id="nomeid" placeholder="Informe o seu nome" required>

                    <label for="emailid">Email:</label>
                    <input type="email" id="emailid"  placeholder="Informe um Email válido" required>

                    <label for="idadeid">Idade:</label>
                    <input type="number" id="idadeid" placeholder="Informe sua idade" min="0" max="120"required>

                    <label for="mmid">Mensagem:</label>
                    <textarea id="mmid" required placeholder="O que deseja nos dizer?"></textarea>
                        
                    <input type="submit" id="enviaid" value="Enviar">
                </fieldset>
            </form>
        </main>

        <footer>
            <nav>
                <a href="../creditos.html">Créditos</a> 
                <a href="../../../index.html">Menu principal</a>
            </nav>
        </footer>
    </div>
</body>
</html>
