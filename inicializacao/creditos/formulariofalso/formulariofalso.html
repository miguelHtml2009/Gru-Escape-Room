<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulariofalso.css">
    <title>Formulário</title>
</head>
<body>
    <div class="elementos">
        <header>
            <h1>Nos envie uma mensagem</h1>
        </header>

        <main>
            <form> 
                <fieldset>
                    <label for="nomeid">Nome:</label>
                    <input type="text" id="nomeid" required>

                    <label for="emailid">Email:</label>
                    <input type="email" id="emailid" required>

                    <label for="idadeid">Idade:</label>
                    <input type="number" id="idadeid">

                    <label for="mmid">Mensagem:</label>
                    <textarea id="mmid" required></textarea>
                        
                    <input type="submit" id="enviaid" value="Enviar">
                </fieldset>
            </form>
        </main>

        <footer>
            <nav>
                <a href="../creditos.html">Créditos</a> 
                <a href="../../menu_principal/menu.html">Menu principal</a>
            </nav>
        </footer>
    </div>
</body>
</html>
