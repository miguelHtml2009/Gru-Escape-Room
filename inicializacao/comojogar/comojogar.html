<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="comojogar.css">
    <link rel="shortcut icon" type="imagex/png" href="../../Sprites/icon.ico">
    <title>Como Jogar</title>
</head>
<body>
    <div class="elementos">
    <header><h1>Como jogar</h1></header>
    <main class="sala">
        <p>Clique nos elementos da tela para interagir com eles:</p>
        <div class="palco" id="palco">
            <canvas id="sala" width="800" height="600" onclick="cliques(event)">Elemento interativo tutorial</canvas>
        </div>
        <div class="informacoes">
            <p id="inventario">Inventário: vazio</p>
            <p id="mensagem" aria-live="polite">Objetivo: escape pela porta.</p>
        </div>
        
        
        <img id="fundo" src="../../Sprites/papelfundotutorial.png" alt="" hidden>
        
        <img id="img-porta-fechada" src="../../Sprites/porta-fechada.svg" alt="" hidden>
        <img id="img-porta-aberta" src="../../Sprites/porta-aberta.svg" alt="" hidden>
        
        <img id="img-gaveta-trancada" src="../../Sprites/gaveta-parafusada.svg" alt="" hidden>
        <img id="img-gaveta-fechada" src="../../Sprites/gaveta-fechada.svg" alt="" hidden>
        <img id="img-gaveta-aberta" src="../../Sprites/gaveta-aberta.svg" alt="" hidden>
        <img id="img-gaveta-zoom" src="../../Sprites/gaveta-zoom.svg" alt="" hidden>
        <img id="img-parafuso" src="../../Sprites/parafuso.svg" alt="" hidden>

        <img id="espelho1" src="../../Sprites/espelho-1.svg" alt="" hidden>
        <img id="espelho2" src="../../Sprites/espelho-2.svg" alt="" hidden>
        <img id="espelho3" src="../../Sprites/espelho-3.svg" alt="" hidden>
        <img id="espelho4" src="../../Sprites/espelho-4.svg" alt="" hidden>
        <img id="espelho5" src="../../Sprites/espelho-5.svg" alt="" hidden>

        <img id="chavefenda" src="../../Sprites/chave-philips.svg" alt="" hidden>
        <img id="img-chave" src="../../Sprites/chave.svg" alt="" hidden>
        
    </main>
    <footer>
        <nav>
            <a href="../../index.html" class="item1">Menu principal</a>
        </nav>
    </footer>
    </div>
    <script src="comojogar.js" defer></script>
</body>
</html>
