<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            min-height: 400px;
            min-width: 800px;
        }
        *{
            margin:0;
        }
        #telaJogo{
            border: 1px solid red;
            width: 800px;
            height: 400px;
            position: relative;
            overflow: hidden;
        }
        #bolinha{
            border-radius: 100%;
            background-color: blue;
            width: 100px;
            height: 100px;
            position: absolute;
            right: 100px; /*left*/
            top: 30px; /* bottom*/
            z-index: 2;

        }

        #quadradinho{
            background-color: rgb(15, 237, 89);
            width: 100px;
            height: 100px;
            position: absolute;
            right: 100px; /*left*/
            top: 30px; /* bottom*/
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="telaJogo">
        <div id="bolinha" ></div>
        <div id="quadradinho"
             style="right: 1px;" 
             onclick="deslocarLado(50)"
             ondblclick="aumentarVelocidade()"
             ></div>
    </div>

    <script>
        velocidade = 0;
        function aumentarVelocidade(){
            velocidade += 10
        }

        function deslocarLado(desloc){
            let x =  quadradinho.style.right
            x = Number(x.replace('px', ''))
            console.log(x)
            if(x > 300){ //early return 
                return
            }
            quadradinho.style.right = `${x+desloc+velocidade}px` 
        }    
    </script>
</body>
</html>
